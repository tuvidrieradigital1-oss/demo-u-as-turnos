<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Salón de Prueba</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #fcf9f2; --primary: #d68c9e; --primary-dark: #c07285; --text-dark: #333; --text-light: #777; --border-color: #e6ddc5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; padding-bottom: 50px; }
        .app-container { width: 100%; max-width: 450px; padding: 20px; }
        #loader { text-align: center; padding: 50px; font-size: 18px; color: var(--primary-dark); }
        .logo-container { text-align: center; margin: 30px 0; }
        .logo-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--primary-dark); font-weight: 600; }
        .main-title { font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; margin-bottom: 25px; }
        .section-title { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        .service-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .service-item { display: flex; justify-content: space-between; padding: 15px; background-color: white; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; }
        .service-item.selected { border: 2px solid var(--primary); background-color: #fffafb; }
        .service-name { font-weight: 500; }
        .service-price { color: var(--primary-dark); font-weight: 500; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; }
        .btn-submit { width: 100%; padding: 18px; background-color: var(--primary); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div id="loader">Cargando Salón Jessi...</div>
    <div class="app-container" id="app-content" style="display:none;">
        <div class="logo-container">
            <div class="logo-title" id="txtNombreSalon">Cargando...</div>
        </div>
        <h1 class="main-title">Reservá tu turno</h1>
        <div class="section-title">1 . SERVICIO</div>
        <div class="service-list" id="serviceList"></div>
        <div class="section-title">FECHA DE PRUEBA</div>
        <div class="form-group">
            <input type="date" id="fechaInput" required>
        </div>
        <form id="bookingForm">
            <div class="form-group">
                <label>Nombre y Apellido</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Tu WhatsApp</label>
                <input type="tel" id="whatsapp" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Solicitar turno</button>
        </form>
    </div>
    <script>
        // ACÁ VAN TUS CREDENCIALES
        const SUPABASE_URL = 'https://msxvgjzozxxjzibnnjrb.supabase.co/rest/v1/'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zeHZnanpvenh4anppYm5uanJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTU4NjEsImV4cCI6MjEwODYzMTg2MX0.FrU756O3fXvA_2RhJd2LsDqGAnJkp0fNcFN8_DG6Xw4'; // <--- PEGÁ TU CLAVE ACÁ
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const SLUG_SALON = 'salon-jessi'; // El slug que creaste en la DB
        
        let selectedService = null;
        let selectedPrecio = null;
        let selectedDuracion = null;

        async function init() {
            const { data, error } = await supabase.from('salones').select('*').eq('slug', SLUG_SALON).single();
            if (error || !data) {
                document.getElementById('loader').innerText = "Error: Salón no encontrado.";
                return;
            }
            
            document.getElementById('txtNombreSalon').innerText = data.nombre;
            if(data.color) document.documentElement.style.setProperty('--primary', data.color);

            const serviceList = document.getElementById('serviceList');
            data.servicios.forEach(srv => {
                const div = document.createElement('div');
                div.className = 'service-item';
                div.innerHTML = `<span class="service-name">${srv.n}</span><span class="service-price">$${srv.p}</span>`;
                div.onclick = () => {
                    document.querySelectorAll('.service-item').forEach(i => i.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedService = srv.n;
                    selectedPrecio = srv.p;
                    selectedDuracion = srv.d;
                };
                serviceList.appendChild(div);
            });

            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        }
        init();

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedService) return alert("Selecciona un servicio.");
            const fecha = document.getElementById('fechaInput').value;

            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Guardando..."; btn.disabled = true;

            const { error } = await supabase.from('turnos').insert({
                salon: SLUG_SALON,
                nombre: document.getElementById('name').value,
                tel: document.getElementById('whatsapp').value,
                servicio: selectedService,
                precio: selectedPrecio,
                dur: selectedDuracion,
                fecha: fecha,
                hora: 1000, // Hora fija de prueba
                estado: 'pendiente'
            });

            if (error) { alert('Error al guardar'); console.error(error); } 
            else { alert('¡Turno guardado en la base de datos de Jessi!'); document.getElementById('bookingForm').reset(); }
            
            btn.innerText = "Solicitar turno"; btn.disabled = false;
        });
    </script>
</body>
</html>
