<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Analis Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #fcf9f2;
            --primary: #d68c9e; 
            --primary-dark: #c07285;
            --gold: #d4b574;
            --text-dark: #333333;
            --text-light: #777777;
            --border-color: #e6ddc5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; padding-bottom: 50px; }
        .app-container { width: 100%; max-width: 450px; background-color: var(--bg-color); padding: 20px; }
        
        #loader { text-align: center; padding: 50px; font-size: 18px; color: var(--primary-dark); }

        .logo-container { text-align: center; margin: 30px 0 40px 0; }
        .logo-circle {
            width: 170px; height: 170px; border: 1px solid var(--border-color); border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin: 0 auto; background-color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden; padding: 10px;
        }
        .logo-svg { width: 45px; height: 45px; margin-bottom: 8px; }
        .logo-svg path { stroke: url(#femGradient); }
        .logo-svg circle, .logo-svg line { stroke: var(--gold); fill: var(--gold); }

        .logo-title {
            font-family: 'Playfair Display', serif; font-size: 18px; color: var(--primary-dark);
            line-height: 1.1; font-weight: 600; text-align: center; margin-bottom: 4px;
        }
        .logo-subtitle { font-size: 8px; letter-spacing: 1.5px; color: var(--gold); text-transform: uppercase; text-align: center; }

        .main-title { font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; margin-bottom: 25px; color: var(--text-dark); }
        .section-title { font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        .service-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .service-item {
            display: flex; justify-content: space-between; align-items: center; padding: 15px;
            background-color: white; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .service-item:hover { border-color: var(--primary); }
        .service-item.selected { border: 2px solid var(--primary); background-color: #fffafb; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .service-name { font-weight: 500; font-size: 15px; }
        .service-price { color: var(--primary-dark); font-weight: 500; }

        .days-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .days-container::-webkit-scrollbar { display: none; }
        .day-card {
            min-width: 65px; padding: 15px 10px; background-color: white; border: 1px solid var(--border-color);
            border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .day-card.selected { border: 2px solid var(--primary); background-color: #fffafb; }
        .day-name { font-size: 11px; color: var(--text-light); text-transform: uppercase; }
        .day-number { font-size: 20px; font-weight: 500; margin: 5px 0; }
        .day-month { font-size: 11px; color: var(--text-light); text-transform: uppercase; }

        .times-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
        .time-btn { padding: 12px 0; background-color: white; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; }
        .time-btn.selected { border: 2px solid var(--primary); color: var(--primary-dark); font-weight: 500; background-color: #fffafb; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; background-color: white; font-size: 15px; color: var(--text-dark); }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .btn-submit {
            width: 100%; padding: 18px; background-color: var(--primary); color: white; border: none;
            border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.3s;
        }
        .btn-submit:hover { background-color: var(--primary-dark); }
        .footer-note { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="loader">Cargando estudio...</div>

    <div class="app-container" id="app-content" style="display:none;">
        
        <div class="logo-container">
            <div class="logo-circle">
                <!-- Si tenés logo_url en la DB, podés poner una etiqueta img aca en vez del svg -->
                <div class="logo-title" id="txtNombreSalon">Cargando...</div>
                <div class="logo-subtitle">Studio & Beauty</div>
            </div>
        </div>

        <h1 class="main-title">Reservá tu turno</h1>

        <div class="section-title">1 . SERVICIO</div>
        <div class="service-list" id="serviceList">
            <!-- Estos servicios se cargan automáticamente desde tu JSONB -->
        </div>

        <div class="section-title">2 . DÍA</div>
        <div class="days-container" id="daysList">
            <div class="day-card selected" data-fecha="2026-10-29">
                <div class="day-name">Jue</div><div class="day-number">29</div><div class="day-month">Oct</div>
            </div>
            <div class="day-card" data-fecha="2026-10-30">
                <div class="day-name">Vie</div><div class="day-number">30</div><div class="day-month">Oct</div>
            </div>
        </div>

        <div class="section-title">3 . HORARIO</div>
        <div class="times-container" id="timesList">
            <div class="time-btn" data-hora="830">08:30</div>
            <div class="time-btn" data-hora="900">09:00</div>
            <div class="time-btn" data-hora="930">09:30</div>
            <div class="time-btn" data-hora="1000">10:00</div>
            <div class="time-btn" data-hora="1030">10:30</div>
        </div>

        <form id="bookingForm">
            <div class="form-group">
                <label>Nombre y Apellido</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label>Tu WhatsApp (sin 0 ni 15, ej: 54911...)</label>
                <input type="tel" id="whatsapp" required>
            </div>
            <div class="form-group">
                <label>Comentarios (Opcional)</label>
                <textarea id="comments"></textarea>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Solicitar turno</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://msxvgjzozxxjzibnnjrb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zeHZnanpvenh4anppYm5uanJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNTU4NjEsImV4cCI6MjEwODYzMTg2MX0.FrU756O3fXvA_2RhJd2LsDqGAnJkp0fNcFN8_DG6Xw4'; // <--- PEGÁ TU LLAVE AQUÍ

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const SLUG_SALON = 'analis-studio'; 
        
        let datosSalon = null;
        let selectedService = null;
        let selectedPrecio = null;
        let selectedDuracion = null;
        let selectedFecha = "2026-10-29"; // Fecha por defecto
        let selectedHoraInt = null;

        async function cargarDatosSalon() {
            try {
                const { data, error } = await supabase
                    .from('salones')
                    .select('*')
                    .eq('slug', SLUG_SALON)
                    .single();

                if (error) throw error;
                datosSalon = data;

                // Color dinámico
                if (data.color) {
                    document.documentElement.style.setProperty('--primary', data.color);
                    document.documentElement.style.setProperty('--primary-dark', data.color);
                }

                document.getElementById('txtNombreSalon').innerText = data.nombre;

                // Cargar servicios desde el JSONB
                const serviceList = document.getElementById('serviceList');
                serviceList.innerHTML = '';
                
                // Tu JSONB se ve así: [{"d":60,"n":"Manicura","p":18000}, ...]
                if (data.servicios && Array.isArray(data.servicios)) {
                    data.servicios.forEach(srv => {
                        const div = document.createElement('div');
                        div.className = 'service-item';
                        div.innerHTML = `
                            <span><span class="service-name">${srv.n}</span> (${srv.d} min)</span>
                            <span class="service-price">$${srv.p}</span>
                        `;
                        div.onclick = () => {
                            document.querySelectorAll('.service-item').forEach(i => i.classList.remove('selected'));
                            div.classList.add('selected');
                            selectedService = srv.n;
                            selectedPrecio = srv.p;
                            selectedDuracion = srv.d;
                        };
                        serviceList.appendChild(div);
                    });
                }

                document.getElementById('loader').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = "Error al cargar el estudio.";
            }
        }

        cargarDatosSalon();

        // Selección de Fecha
        document.querySelectorAll('.day-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.day-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedFecha = card.getAttribute('data-fecha');
            });
        });

        // Selección de Hora
        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedHoraInt = parseInt(btn.getAttribute('data-hora'));
            });
        });

        // Guardar Turno
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedService) return alert("Por favor, selecciona un servicio.");
            if (!selectedHoraInt) return alert("Por favor, selecciona un horario.");

            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Guardando...";
            btn.disabled = true;

            const name = document.getElementById('name').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const comments = document.getElementById('comments').value;

            // Insertar respetando EXACTAMENTE las columnas de tu captura
            const { error } = await supabase
                .from('turnos')
                .insert({
                    salon: SLUG_SALON,
                    nombre: name,
                    tel: whatsapp,
                    servicio: selectedService,
                    precio: selectedPrecio,
                    dur: selectedDuracion,
                    fecha: selectedFecha,
                    hora: selectedHoraInt,
                    notas: comments,
                    estado: 'pendiente'
                });

            if (error) {
                console.error(error);
                alert('Hubo un error al guardar el turno.');
                btn.innerText = "Solicitar turno";
                btn.disabled = false;
                return;
            }

            alert('¡Turno solicitado con éxito!');
            document.getElementById('bookingForm').reset();
            btn.innerText = "Solicitar turno";
            btn.disabled = false;
        });
    </script>
</body>
</html>
